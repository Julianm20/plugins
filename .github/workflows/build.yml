name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build all plugins
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Resolves paper-api from repo.papermc.io and compiles all three modules.
      - name: Build
        run: mvn -B --no-transfer-progress clean package

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: '*/target/*.jar'
          # Fails the run if the build somehow produced no JARs.
          if-no-files-found: error
          retention-days: 30

  bot:
    name: Build Discord bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trait-smp-bot

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trait-smp-bot/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and compile
        run: npm run build
